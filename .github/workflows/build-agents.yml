name: Build agents

# Builds the Tactical RMM agent from the rmmagent repo for every platform the
# server can hand out and publishes it as a release named after the agent
# version, with the file names the server downloads:
#   tacticalagent-v<ver>-windows-<arch>.exe   Inno Setup installer
#   tacticalagent-v<ver>-linux-<arch>         static binary
#   tacticalagent-v<ver>-darwin-<arch>        static binary
#   tacticalagent_<ver>-1_<arch>.deb, tacticalagent-<ver>-1.<arch>.rpm,
#   tacticalagent_<ver>-r1_<arch>.apk (unsigned, apk add --allow-untrusted)
#
# Runs daily and skips the build when the release for this version already
# holds the current rmmagent commit; run it by hand to force a build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "rmmagent branch, tag or commit (default: RMMAGENT_REF variable, else develop)"
        required: false
      force:
        description: "Rebuild even if the release already has this commit"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [develop, main]
    paths: [".github/workflows/build-agents.yml"]

permissions:
  contents: write

concurrency:
  group: build-agents
  cancel-in-progress: false

env:
  RMMAGENT_REPO: ${{ vars.RMMAGENT_REPO || 'second2falcon/rmmagent' }}
  RMMAGENT_REF: ${{ inputs.ref || vars.RMMAGENT_REF || 'develop' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RMMAGENT_REPO }}
          ref: ${{ env.RMMAGENT_REF }}
          token: ${{ secrets.RMMAGENT_TOKEN || github.token }}
          path: src

      - name: Read version and decide whether to build
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          version=$(grep -oP '^\s*version\s*=\s*"\K[^"]+' src/main.go)
          sha=$(git -C src rev-parse HEAD)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          build=true
          if [ "${FORCE}" != "true" ] && [ "${{ github.event_name }}" = "schedule" ] &&
             gh release view "v${version}" -R "${{ github.repository }}" --json body -q .body 2>/dev/null | grep -q "${sha}"; then
            build=false
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Agent v${version} from ${RMMAGENT_REPO}@${RMMAGENT_REF} (${sha}), build=${build}" >> "$GITHUB_STEP_SUMMARY"

  unix:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RMMAGENT_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.RMMAGENT_TOKEN || github.token }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Test
        working-directory: src
        run: go test ./agent/...

      - name: Build linux and darwin
        working-directory: src
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/386 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "Building ${os}/${arch}"
            env CGO_ENABLED=0 GOOS=${os} GOARCH=${arch} \
              go build -trimpath -ldflags "-s -w" -o "../dist/tacticalagent-v${VER}-${os}-${arch}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: agents-unix
          path: dist/*
          if-no-files-found: error

  packages:
    needs: [prepare, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agents-unix
          path: dist

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build .deb, .rpm and .apk
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          nfpm="$(go env GOPATH)/bin/nfpm"
          mkdir -p pkgroot out
          # go arch:nfpm arch, nfpm maps these to the deb and rpm names
          for pair in amd64:amd64 386:386 arm64:arm64 arm:arm7; do
            install -m 0755 "dist/tacticalagent-v${VER}-linux-${pair%%:*}" pkgroot/tacticalagent
            for format in deb rpm apk; do
              PKG_ARCH=${pair#*:} "${nfpm}" pkg -f packaging/nfpm.yaml -p "${format}" -t out/
            done
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: agents-packages
          path: out/*
          if-no-files-found: error

  # The linux agent is a static binary, one build serves every distribution.
  # Start it on each distro family to catch libc or loader problems, and
  # install the matching package where there is one.
  distro-smoke:
    needs: [prepare, unix, packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", pkg: deb }
          - { image: "ubuntu:24.04", pkg: deb }
          - { image: "rockylinux:9", pkg: rpm }
          - { image: "fedora:41", pkg: rpm }
          - { image: "opensuse/leap:15.6", pkg: rpm }
          - { image: "alpine:3.22", pkg: apk }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agents-unix
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: agents-packages
          path: dist

      - name: Run agent on ${{ matrix.image }}
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x dist/tacticalagent-v*
          docker run --rm -v "$PWD/dist:/dist:ro" -e VER -e PKG="${{ matrix.pkg }}" "${{ matrix.image }}" sh -euc '
            "/dist/tacticalagent-v${VER}-linux-amd64" -version | grep "${VER}"
            case "${PKG}" in
            deb) dpkg -i "/dist/tacticalagent_${VER}-1_amd64.deb" ;;
            rpm) rpm -i "/dist/tacticalagent-${VER}-1.x86_64.rpm" ;;
            apk) apk add --no-network --allow-untrusted "/dist/tacticalagent_${VER}-r1_x86_64.apk" ;;
            esac
            /usr/local/bin/tacticalagent -version | grep "${VER}"
            if [ "${PKG}" = apk ]; then
              test -x /etc/init.d/tacticalagent
            else
              test -f /usr/lib/systemd/system/tacticalagent.service
            fi
          '

  windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RMMAGENT_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.RMMAGENT_TOKEN || github.token }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install goversioninfo and Inno Setup
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        shell: bash
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # setup.iss uses these fixed paths
          stage=/c/Users/Public/Documents/agent
          mkdir -p dist "${stage}/build"
          cp -r src/build/. "${stage}/build/"
          dist_win=$(cygpath -w "$PWD/dist")

          # the icon is not part of the rmmagent repo, build without it if missing
          if [ ! -f src/build/onit.ico ]; then
            python -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['IconPath']=''; json.dump(d, open(p,'w'), indent=2)" src/versioninfo.json
            sed -i -E '/^(SetupIconFile|WizardSmallImageFile)=/d' "${stage}/build/setup.iss"
          fi
          echo "versioninfo.json: $(wc -c < src/versioninfo.json) bytes"

          gvi="$(go env GOPATH)/bin/goversioninfo.exe"
          cd src
          for arch in amd64 386; do
            rm -f resource*.syso
            flags=()
            if [ "${arch}" = amd64 ]; then flags=(-64); fi
            "${gvi}" "${flags[@]}" -o "resource_windows_${arch}.syso" versioninfo.json

            CGO_ENABLED=0 GOOS=windows GOARCH=${arch} \
              go build -trimpath -ldflags "-s -w" -o "${stage}/tacticalrmm.exe"

            # keep git bash from rewriting the /O /F switches into paths
            MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q \
              "/O${dist_win}" "/Ftacticalagent-v${VER}-windows-${arch}" \
              'C:\Users\Public\Documents\agent\build\setup.iss'
          done
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: agents-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, unix, packages, distro-smoke, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release v${{ needs.prepare.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd dist
          sha256sum tacticalagent* > SHA256SUMS
          cat SHA256SUMS
          notes="Built from ${RMMAGENT_REPO}@${SHA} (${RMMAGENT_REF}). Windows files are unsigned."
          tag="v${VER}"
          if gh release view "${tag}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${tag}" ./* --clobber -R "${{ github.repository }}"
            gh release edit "${tag}" --notes "${notes}" -R "${{ github.repository }}"
          else
            gh release create "${tag}" ./* --title "Agent ${tag}" --notes "${notes}" -R "${{ github.repository }}"
          fi
